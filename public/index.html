<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wanderly – plánování výletů s přáteli</title>
  <meta name="description" content="Plánuj výlety s přáteli jednoduše. Letenky, ubytování, místa a společný program na jednom plátně.">
  <meta name="theme-color" content="#fbfbfb">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <!-- Obrysové ikony (Material Symbols) – jen použité ikony, seznam drží test/icons.test.js -->
  <link id="icon-font" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,300..500,0..1,0&icon_names=__ICONS__&display=block">
  <link rel="modulepreload" href="/widgets.js">
  <link rel="modulepreload" href="/social.js">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <a class="brand" href="#/"><span class="ms">explore</span>Wanderly</a>
      <nav class="segnav" aria-label="Hlavní navigace">
        <a href="#/" data-nav="search">Hlavní stránka</a>
        <a href="#/explore" data-nav="explore">Prozkoumat</a>
        <a href="#/trips" data-nav="trips">Vytvořit výlet</a>
        <a href="#/chat" data-nav="chat">Chat s přáteli<span class="nav-badge" data-chat-badge hidden></span></a>
        <a href="#/account" data-nav="account">Můj profil</a>
      </nav>
      <div class="account" id="account"></div>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="footer-in">
      <span>Wanderly • Minimalistické plánování cest s přáteli</span>
      <nav><a href="#/">Přehled</a><a href="#/explore">Destinace</a><a href="#/trips">Plánovač</a><a href="https://github.com/JaneckaD/tripfinder/issues" target="_blank" rel="noopener">Podpora</a></nav>
    </div>
  </footer>

  <nav class="bottomnav" aria-label="Navigace">
    <a href="#/" data-nav="search"><span class="ms">home</span>Domů</a>
    <a href="#/explore" data-nav="explore"><span class="ms">explore</span>Prozkoumat</a>
    <a href="#/trips" data-nav="trips"><span class="ms">add_circle</span>Výlety</a>
    <a href="#/chat" data-nav="chat"><span class="ms">chat_bubble</span>Chat<span class="nav-badge" data-chat-badge hidden></span></a>
    <a href="#/account" data-nav="account" id="bottom-account"><span class="ms">person</span>Profil</a>
  </nav>

  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
